# Render — Lily Nails Studio backend (Node/Express)
# Blueprint deploy: New → Blueprint → point at this repo. Fill secret values in the dashboard.
services:
  - type: web
    name: lily-nails-backend
    runtime: node
    plan: starter            # upgrade as traffic grows
    region: singapore        # closest to India; change if preferred
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: EXTERNAL_TIMEOUT_MS
        value: 12000
      # Frontend origin(s) allowed by CORS — set to your Netlify domain.
      - key: CORS_ORIGINS
        sync: false
      # Secrets — set these in the Render dashboard (never commit).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        sync: false
      - key: PARCEL_LENGTH_CM
        value: 15
      - key: PARCEL_BREADTH_CM
        value: 12
      - key: PARCEL_HEIGHT_CM
        value: 3
      - key: PARCEL_WEIGHT_KG
        value: 0.3
