<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lily Nails Studio</title>
<link rel="stylesheet" href="_ds/lily-nails-studio-design-system-5de5bfd2-ccaa-4707-982d-a2a7a4716cc8/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/lily-nails-studio-design-system-5de5bfd2-ccaa-4707-982d-a2a7a4716cc8/_ds_bundle.js"></script>
<style>
html,body{margin:0;background:var(--white-warm);scroll-behavior:smooth}
a{color:var(--accent-strong)}a:hover{color:var(--rose-gold-deep)}
.lily-nav a{position:relative}
.lily-nav a::after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--accent-strong);transition:width var(--dur-med) var(--ease-soft)}
.lily-nav a:hover::after{width:100%}
@keyframes floaty{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-16px) rotate(4deg)}}
@keyframes lilyFade{from{opacity:0}to{opacity:1}}
@keyframes lilyRise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease-out),transform .8s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.lily-ig-tile:hover .lily-ig-heart{opacity:1}
.lily-ig-tile img{transition:transform var(--dur-slow) var(--ease-out)}
.lily-ig-tile:hover img{transform:scale(1.06)}
.lily-qr-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.lily-share-btn:hover{color:var(--accent-strong)}
.lily-share-btn:active{opacity:.7}
html,body{max-width:100%;overflow-x:hidden}
img{max-width:100%}
.lily-burger{display:none}
@media(max-width:600px){
  :root{--space-section:52px}
  .lily-qv{max-height:92vh!important}
  .lily-qv-img{min-height:0!important;height:40vh!important}
  .lily-qv-img img{position:relative!important}
}
@media(max-width:900px){
  .lily-hero-grid,.lily-story-grid,.lily-contact-grid{grid-template-columns:1fr!important}
  .lily-grid-3,.lily-grid-4{grid-template-columns:repeat(2,1fr)!important}
  .lily-ig-grid{grid-template-columns:repeat(3,1fr)!important}
  .lily-foot-grid{grid-template-columns:1fr 1fr!important}
  .lily-qv{grid-template-columns:1fr!important}
  .lily-nav{display:none!important}
  .lily-burger{display:inline-flex!important}
}
@media(max-width:560px){
  .lily-grid-3,.lily-grid-4{grid-template-columns:1fr!important}
  .lily-foot-grid{grid-template-columns:1fr!important}
}
</style></head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#FADBE8"/><g transform="translate(50,52)" fill="none" stroke="#B0757C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 8c-9-13-24-19-31-12s5 19 31 12Zm0 0c9-13 24-19 31-12s-5 19-31 12Z"/><circle cx="0" cy="8" r="5" fill="#B0757C"/><path d="M-6 11l-8 24 14-8 14 8-8-24"/></g></svg></template>
<div id="root"></div>
<script src="app/data.jsx"></script>
<script type="text/babel" src="app/cart.jsx"></script>
<script src="app/india.jsx"></script>
<script type="text/babel" src="app/GlowCard.jsx"></script>
<script type="text/babel" src="app/Header.jsx"></script>
<script type="text/babel" src="app/Hero.jsx"></script>
<script type="text/babel" src="app/Collections.jsx"></script>
<script type="text/babel" src="app/Story.jsx"></script>
<script type="text/babel" src="app/Extras.jsx"></script>
<script type="text/babel" src="app/QuickView.jsx"></script>
<script type="text/babel" src="app/CartDrawer.jsx"></script>
<script type="text/babel" src="app/Footer.jsx"></script>
<script type="text/babel">
function App(){
  const wl=window.useWishlist();
  const [quick,setQuick]=React.useState(null);
  const onWish=id=>window.LilyWishlist.toggle(id);
  const wished=new Proxy({},{get:(_,k)=>wl.has(String(k))});
  React.useEffect(()=>{
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
    return()=>io.disconnect();
  },[]);
  const {Header,Hero,BestSellers,NavratriCollection,NewArrivals,WhyPressOn,About,Instagram,Shipping,Contact,QuickView,Footer,CartDrawer,CartToast,WishlistDrawer}=window;
  const grid={wished,onWish,onQuick:setQuick};
  return(<React.Fragment>
    <Header/>
    <Hero/>
    <div className="reveal"><BestSellers {...grid}/></div>
    <div className="reveal"><NavratriCollection {...grid}/></div>
    <div className="reveal"><NewArrivals {...grid}/></div>
    <div className="reveal"><WhyPressOn/></div>
    <div className="reveal"><About/></div>
    <div className="reveal"><Instagram/></div>
    <div className="reveal"><Shipping/></div>
    <div className="reveal"><Contact/></div>
    <Footer/>
    <QuickView product={quick} wished={quick?wl.has(quick.id):false} onWish={onWish} onClose={()=>setQuick(null)}/>
    <CartDrawer/>
    <WishlistDrawer/>
    <CartToast/>
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
