# Netlify — Lily Nails Studio frontend
# The site is a single self-contained HTML file; no build step.
[build]
  publish = "."
  command = ""

# Serve the standalone file at the root.
[[redirects]]
  from = "/"
  to = "/Lily Nails Studio (standalone).html"
  status = 200

# Security headers for the static frontend.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
